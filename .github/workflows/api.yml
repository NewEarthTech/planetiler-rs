name: api

# Continuous deployment for the run-api dispatch Lambda (#59): every push to
# main that touches the crate or its stack builds the aarch64 musl-static
# bootstrap natively on arm64 (provided.al2023's glibc is older than the
# runner's, so static sidesteps the mismatch) and redeploys RunApiStack. No
# AWS keys — same OIDC role and guard pattern as backend.yml: flip
# API_DEPLOY_ENABLED only after the first deploy has been run by hand (it
# creates the api.runner DNS record + certificate John should watch land).
on:
  push:
    branches: [main]
    paths:
      - "crates/run-api/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "infra/runner/lib/api-stack.ts"
      - "infra/runner/bin/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token used to assume the AWS role
  contents: read

concurrency: api-deploy

jobs:
  api:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.API_DEPLOY_ENABLED == 'true' }}
    # Same caching setup as ci.yml: aws-sdk-ec2 is enormous, and the first
    # uncached full-opt build blew the job timeout (exit 143 mid-crate).
    # The `lambda` profile (opt-level 1) is the other half of that fix.
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - uses: mozilla-actions/sccache-action@v0.0.10

      # -j 1: the exit-143s were systemd-oomd SIGTERMing the cgroup whenever
      # aws-sdk-ec2 and aws-sdk-ssm — the SDK's two giant crates — compiled
      # concurrently. Measured in a 4-core capped container: ec2's rustc
      # alone peaks at 7.2 GiB / 4 min under this profile, which fits the
      # 16 GB runner; two such frontends plus rlib churn do not. Serial
      # compiles cap peak memory at the single biggest crate, and sccache
      # makes the serialization cheap on every run after the first.
      # (codegen-units=1 was tried and is WORSE: one merged LLVM module for
      # ec2 exceeds 10 GiB on its own.)
      - name: Build run-api (aarch64 musl static)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add aarch64-unknown-linux-musl
          cargo build -j 1 -p run-api --profile lambda --locked --target aarch64-unknown-linux-musl
          mkdir -p infra/runner/dist-api
          cp target/aarch64-unknown-linux-musl/lambda/run-api infra/runner/dist-api/bootstrap

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy RunApiStack
        working-directory: infra/runner
        env:
          RUNNER_ZONE_ID: ${{ vars.RUNNER_ZONE_ID }}
        run: pnpm exec cdk deploy RunApiStack --require-approval never
