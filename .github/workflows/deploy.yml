name: deploy

# Continuous deployment for the runner console: every push to main that touches
# the app (or the shared web workspace it builds from) rebuilds apps/runner and
# republishes RunnerConsoleStack. No AWS keys — the job assumes an OIDC role
# (infra/ci) whose trust is pinned to this repo's main branch.
on:
  push:
    branches: [main]
    paths:
      - "apps/runner/**"
      - "packages/ui/**"
      - "infra/runner/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token used to assume the AWS role
  contents: read

concurrency: deploy

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip until the one-time wiring exists (infra/ci deployed, repo variables
    # set), so this workflow can land on main without a red run first.
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the console
        run: pnpm --filter @planetiler-rs/runner build

      # The infra islands are bun projects; bun only installs, cdk runs on node.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile
        working-directory: infra/runner

      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy RunnerConsoleStack
        working-directory: infra/runner
        env:
          RUNNER_ZONE_ID: ${{ vars.RUNNER_ZONE_ID }}
        run: npx cdk deploy --require-approval never
