name: site

# Continuous deployment for the planetiler.rs site: every push to main that
# touches the splash, the dashboard (or the shared web workspace it builds
# from), or the site's stack rebuilds apps/docs and republishes
# PlanetilerRsSiteStack. No AWS keys — same OIDC role and guard as deploy.yml.
on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/splash/**"
      - "packages/ui/**"
      - "infra/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token used to assume the AWS role
  contents: read

concurrency: site-deploy

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same one-time-wiring guard as deploy.yml — and additionally the stack
    # must have been deployed once by hand (house rule: the first deploy of
    # any new stack is manual+watched). Flip the variable to enable.
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.SITE_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      # One workspace install covers the app and the infra packages alike.
      - run: pnpm install --frozen-lockfile

      - name: Build the dashboard
        run: pnpm --filter @planetiler-rs/docs build

      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy PlanetilerRsSiteStack
        working-directory: infra/docs
        env:
          SITE_ZONE_ID: ${{ vars.SITE_ZONE_ID }}
        run: pnpm exec cdk deploy --require-approval never
