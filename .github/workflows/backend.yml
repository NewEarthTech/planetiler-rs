name: backend

# Continuous deployment for the runner-live SSE backend (#59): every push to
# main that touches the crate or its stack rebuilds the binary natively on
# arm64 (glibc-matched to the Ubuntu 24.04 box) and redeploys
# RunnerBackendStack — a changed binary replaces the instance via its asset
# hash in user-data. No AWS keys — same OIDC role and guard as deploy.yml.
on:
  push:
    branches: [main]
    paths:
      - "crates/runner-live/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "infra/runner/**"
      # The console stack shares the infra dir but not this stack: a
      # site-stack-only merge must not risk an instance swap, because every
      # replacement re-issues the Let's Encrypt cert (#65, 5/week limit).
      # backend-stack.ts only imports fixed-name constants from it; if one of
      # those ever changes, deploy by hand (workflow_dispatch).
      - "!infra/runner/lib/site-stack.ts"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token used to assume the AWS role
  contents: read

concurrency: backend-deploy

jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    # Same one-time-wiring guard as deploy.yml — and additionally the stack
    # must have been deployed once by hand (it creates the EIP + DNS record
    # John should watch land). Flip the variable to enable.
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && vars.BACKEND_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # rustup ships on the hosted runners and honours rust-toolchain.toml;
      # runner-live doesn't touch the protobuf build script, so no protoc.
      - name: Build runner-live (native arm64)
        run: |
          cargo build -p runner-live --release --locked
          mkdir -p infra/runner/dist-backend
          cp target/release/runner-live infra/runner/dist-backend/runner-live

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy RunnerBackendStack
        working-directory: infra/runner
        env:
          RUNNER_ZONE_ID: ${{ vars.RUNNER_ZONE_ID }}
        run: pnpm exec cdk deploy RunnerBackendStack --require-approval never
