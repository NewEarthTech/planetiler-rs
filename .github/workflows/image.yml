name: image

# Build the planetiler-rs runner image and push it to ECR (planetiler-rs-bench).
# On merges to main it builds arm64 natively and pushes two tags — the commit
# sha and `main` — whenever the image's bytes would change (source, deps,
# toolchain, or the recipe). Pushes to perf/** and engine/** branches build
# and push the `:sha` tag only — the candidate image an A/B dispatch compares
# against `:main` (#59's scoping note) — never the moving `:main` tag. On PRs
# it builds only when the recipe itself changes (Dockerfile/deps/toolchain),
# to catch a broken build before main; a source-only PR is already compiled by
# the x86 `test` job, so it doesn't also pay for a full arm64 build here — a
# candidate branch's own push event covers the image. workflow_dispatch from
# one of these branches is the escape hatch when a needed `:sha` image exists
# for no pushed path (say, a bench-only candidate). No AWS keys: the push
# assumes the infra/ci OIDC role, trust pinned to this repo.
on:
  push:
    branches: [main, "perf/**", "engine/**"]
    paths:
      # Only the CLI crate: the Dockerfile builds --bin planetiler-rs and
      # nothing else, and that package has no path dependencies, so run-api
      # and runner-live cannot change a byte of the image. Watching all of
      # crates/** bought a full native arm64 compile on every backend change
      # for a binary that came out identical. proto/ lives inside this crate.
      - "crates/planetiler-rs-cli/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "services/cloud-runner/Dockerfile"
      # The box-side scripts baked into the image (keep in step with the
      # Dockerfile's COPY list; the laptop-side scripts don't rebuild it).
      - "services/cloud-runner/run-job.sh"
      - "services/cloud-runner/jobs.sh"
      - "services/cloud-runner/remote.sh"
      - "services/cloud-runner/remote-planet.sh"
      - "services/cloud-runner/tiles-delta.sh"
      - "services/cloud-runner/drain.sh"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "services/cloud-runner/Dockerfile"
      - "services/cloud-runner/run-job.sh"
      - "services/cloud-runner/jobs.sh"
      - "services/cloud-runner/remote.sh"
      - "services/cloud-runner/remote-planet.sh"
      - "services/cloud-runner/tiles-delta.sh"
      - "services/cloud-runner/drain.sh"
      - ".dockerignore"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  id-token: write # mint the OIDC token used to assume the AWS role
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    # Native arm64 — the bench boxes are Graviton (r7g/r7gd), and emulating the
    # cargo release build under QEMU on an x86 runner is far slower. Fallback if
    # arm hosted runners are ever unavailable: runs-on ubuntu-latest plus a
    # docker/setup-qemu-action step, at the cost of a much longer build.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Push from main and the A/B candidate branches, and only once the OIDC
      # role is wired (mirrors deploy.yml's guard). PRs and un-wired accounts
      # build without pushing.
      - id: gate
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          case "${{ github.ref }}" in
            refs/heads/main|refs/heads/perf/*|refs/heads/engine/*) pushable=true ;;
            *) pushable=false ;;
          esac
          if [ "$pushable" = "true" ] \
            && [ "${{ github.event_name }}" != "pull_request" ] \
            && [ -n "$ROLE" ]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.push == 'true'
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - if: steps.gate.outputs.push == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      # Real ECR tags when pushing; a throwaway local tag when only validating.
      # Only main moves the `:main` tag — a candidate branch pushes its `:sha`
      # and nothing else, so it can never change what a plain dispatch pulls.
      - id: meta
        run: |
          if [ "${{ steps.gate.outputs.push }}" = "true" ]; then
            reg="${{ steps.ecr.outputs.registry }}"
            {
              echo "tags<<EOF"
              echo "$reg/planetiler-rs-bench:${{ github.sha }}"
              if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                echo "$reg/planetiler-rs-bench:main"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "tags=planetiler-rs-bench:ci" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: services/cloud-runner/Dockerfile
          platforms: linux/arm64
          push: ${{ steps.gate.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # A plain single-arch image a box pulls cleanly — no attestation
          # manifest with its "unknown/unknown" platform entry.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
