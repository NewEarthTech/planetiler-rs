<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tilebench — planetiler-rs benchmarks</title>
    <meta
      name="description"
      content="Live benchmark scoreboard for planetiler-rs vs Java Planetiler: wall time, peak memory, and cost per build across OSM extracts from Monaco to Europe."
    />
    <script>
      // Set theme before first paint to avoid a flash. ?theme=dark|light
      // overrides (handy for screenshots and sharing).
      const param = new URLSearchParams(location.search).get("theme");
      const stored = localStorage.getItem("tilebench-theme");
      const dark =
        param === "dark" ||
        (param !== "light" &&
          (stored === "dark" ||
            (stored === null &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)));
      document.documentElement.classList.toggle("dark", dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
