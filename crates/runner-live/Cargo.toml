[package]
name = "runner-live"
version = "0.1.0"
edition = "2024"
description = "Consumer backend for the planetiler-rs runner console: ingests run logs and serves them as live SSE streams."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NewEarthTech/planetiler-rs"
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "fs", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
aws-config = "1"
aws-sdk-cloudwatchlogs = "1"
