[package]
name = "run-api"
version = "0.1.0"
edition = "2024"
description = "Dispatch API for the planetiler-rs runner console: requisition, dispatch, watch, cancel, and destroy bench boxes."
license = "MIT OR Apache-2.0"
repository = "https://github.com/NewEarthTech/planetiler-rs"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
lambda_http = "1"
aws-config = "1"
aws-sdk-ec2 = "1"
aws-sdk-ssm = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
