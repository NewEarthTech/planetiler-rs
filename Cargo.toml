[package]
name = "planetiler-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust port of Planetiler: planet-scale vector tile generation from OpenStreetMap and other geodata."
default-run = "planetiler-rs"

[dependencies]
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
prost = "0.14.4"
rusqlite = { version = "0.40.1", features = ["bundled"] }
flate2 = "1.1.9"
serde_json = "1.0.150"
geo-types = "0.7.19"
geojson = { version = "1", features = ["geo-types"] }
tempfile = "3.27.0"
serde = { version = "1.0.228", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
rayon = "1.12.0"
osmpbf = "0.3.8"
memmap2 = "0.9.9"
geo = "0.33.1"
shapefile = { version = "0.8.0", features = ["geo-types"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "tile_coord"
harness = false

[[bench]]
name = "mvt"
harness = false

[[bench]]
name = "mbtiles"
harness = false

[build-dependencies]
prost-build = "0.14.4"
