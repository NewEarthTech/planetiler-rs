[package]
name = "planetiler-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust port of Planetiler: planet-scale vector tile generation from OpenStreetMap and other geodata."
default-run = "planetiler-rs"

[dependencies]
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
prost = "0.14.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "tile_coord"
harness = false

[build-dependencies]
prost-build = "0.14.4"
